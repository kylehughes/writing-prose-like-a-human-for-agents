name: Release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag and content
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/check.py --version "$RELEASE_VERSION"
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Package skill and plugin
        run: python3 scripts/package.py
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" dist/writing-prose-like-a-human-skill.zip dist/writing-prose-like-a-human-plugin.zip --verify-tag --title "Release $RELEASE_VERSION" --generate-notes
